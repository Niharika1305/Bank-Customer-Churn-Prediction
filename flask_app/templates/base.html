<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Home | ChurnSense AI{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Favicon -->
    <link rel="icon"
          href="{{ url_for('static', filename='images/favicon.ico') }}">

</head>


<body>


<!-- ==========================================================
     NAVIGATION BAR
=========================================================== -->

<nav class="navbar">

    <div class="container navbar-container">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="ChurnSense AI Logo"
                class="logo-img"
            >

            <span class="logo-text">
                ChurnSense AI
            </span>

        </div>


        <!-- NAVIGATION LINKS -->

        <ul class="nav-links">

            <li>
                <a href="/">
                    Home
                </a>
            </li>

            <li>
                <a href="/#about">
                    About
                </a>
            </li>

            <li>
                <a href="/#features">
                    Features
                </a>
            </li>

            <li>
                <a href="/#contact">
                    Contact
                </a>
            </li>

        </ul>


        <!-- PREDICT BUTTON -->

        <a
            href="{{ url_for('predict') }}"
            class="btn"
        >
            Predict Now
        </a>


    </div>

</nav>



<!-- ==========================================================
     MAIN CONTENT
=========================================================== -->

<main id="main-content">

    {% block content %}

    {% endblock %}

</main>



<!-- ==========================================================
     JAVASCRIPT
=========================================================== -->

<script src="{{ url_for('static', filename='js/script.js') }}"></script>


</body>

</html>
